<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QAG — Control de asistencia</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
      text-align: center;
    }

    .contenedor {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #666;
      margin-top: 0;
      margin-bottom: 25px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    #camara {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      background: black;
      margin-top: 10px;
    }

    #canvas {
      display: none;
    }

    #estado {
      margin-top: 20px;
      padding: 18px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .esperando {
      background: #e9e9e9;
      color: #555;
    }

    .procesando {
      background: #fff3cd;
      color: #856404;
    }

    .ok {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    #detalle {
      margin-top: 12px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>QAG</h1>
    <p class="subtitulo">Control de asistencia</p>

    <select id="docente">
      <option value="">Seleccionar docente</option>
      <option value="Cecilia">Cecilia</option>
      <option value="Silvia">Silvia</option>
      <option value="Carolina">Carolina</option>
      <option value="Florencia">Florencia</option>
    </select>

    <button id="botonCamara">
      📷 INICIAR ESCÁNER
    </button>

    <video id="camara" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="estado" class="esperando">
      Seleccioná un docente e iniciá el escáner
    </div>

    <div id="detalle"></div>

  </div>

  <script>

    /*
     * URL DE LA NUEVA IMPLEMENTACIÓN
     * DE GOOGLE APPS SCRIPT
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxAbEVgXcRqwL_KQWpxJQ6HN-DyuPn1A3gVC7itKercNeLP9elsSmu68J6G-6tM0TEC/exec";


    const video =
      document.getElementById("camara");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const docenteSelect =
      document.getElementById("docente");

    const botonCamara =
      document.getElementById("botonCamara");

    const estado =
      document.getElementById("estado");

    const detalle =
      document.getElementById("detalle");


    let stream = null;

    let escaneando = false;

    let procesando = false;


    botonCamara.addEventListener(
      "click",
      iniciarEscaner
    );


    async function iniciarEscaner() {

      if (procesando) return;


      const docente =
        docenteSelect.value;


      if (!docente) {

        mostrarEstado(
          "Seleccioná primero el docente",
          "error"
        );

        return;
      }


      detalle.textContent = "";


      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "environment"
            },

            audio: false

          });


        video.srcObject =
          stream;


        escaneando = true;


        botonCamara.textContent =
          "📷 ESCANEANDO...";


        mostrarEstado(
          "Esperando código QR...",
          "esperando"
        );


        requestAnimationFrame(
          escanear
        );


      } catch (error) {

        console.error(error);


        mostrarEstado(
          "NO SE PUDO ACCEDER A LA CÁMARA",
          "error"
        );

      }
    }


    function escanear() {

      if (!escaneando) return;


      if (
        video.readyState ===
        video.HAVE_ENOUGH_DATA
      ) {


        canvas.width =
          video.videoWidth;


        canvas.height =
          video.videoHeight;


        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const imageData =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const codigo =
          jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
              inversionAttempts:
                "attemptBoth"
            }
          );


        if (codigo) {


          console.log(
            "QR DETECTADO:",
            codigo.data
          );


          escaneando = false;


          detenerCamara();


          registrarAsistencia(
            codigo.data
          );


          return;
        }
      }


      setTimeout(() => {

        requestAnimationFrame(
          escanear
        );

      }, 100);

    }


    function detenerCamara() {

      escaneando = false;


      if (stream) {

        stream
          .getTracks()
          .forEach(track => {

            track.stop();

          });

        stream = null;
      }


      video.srcObject = null;


      botonCamara.textContent =
        "📷 INICIAR ESCÁNER";

    }


    /*
     * =====================================================
     * REGISTRAR ASISTENCIA MEDIANTE JSONP
     * =====================================================
     */

    function registrarAsistencia(id) {

      if (procesando) return;


      procesando = true;


      const docente =
        docenteSelect.value;


      mostrarEstado(
        "PROCESANDO ASISTENCIA...",
        "procesando"
      );


      detalle.textContent =
        "QR detectado: " + id;


      /*
       * Creamos un nombre único para
       * la función de respuesta.
       */

      const callbackName =
        "qagCallback_" +
        Date.now();


      /*
       * Esta función recibirá la respuesta
       * enviada por Google Apps Script.
       */

      window[callbackName] =
        function(datos) {

          console.log(
            "RESPUESTA DEL SERVIDOR:",
            datos
          );


          /*
           * ASISTENCIA REGISTRADA
           */

          if (
            datos.ok &&
            datos.estado ===
            "REGISTRADO"
          ) {

            mostrarEstado(
              "✓ ASISTENCIA REGISTRADA",
              "ok"
            );


            detalle.innerHTML =
              "<strong>" +
              (datos.detalle || "") +
              "</strong><br>" +
              (datos.clase || "");

          }


          /*
           * YA REGISTRADO
           */

          else if (
            datos.estado ===
            "DUPLICADO"
          ) {

            mostrarEstado(
              "⚠ YA REGISTRADO",
              "procesando"
            );


            detalle.textContent =
              datos.detalle || "";

          }


          /*
           * CUALQUIER OTRO ERROR
           */

          else {

            mostrarEstado(
              datos.mensaje ||
              "ERROR",
              "error"
            );


            detalle.textContent =
              datos.detalle || "";

          }


          /*
           * Eliminamos la función
           * temporal del navegador.
           */

          delete window[callbackName];


          /*
           * Eliminamos el script
           * temporal de la página.
           */

          const script =
            document.getElementById(
              callbackName
            );


          if (script) {
            script.remove();
          }


          procesando = false;

        };


      /*
       * Construimos la URL que llama
       * al doGet(e) de Apps Script.
       */

      const url =
        API_URL +
        "?accion=REGISTRAR" +
        "&id=" +
        encodeURIComponent(id) +
        "&docente=" +
        encodeURIComponent(docente) +
        "&callback=" +
        encodeURIComponent(callbackName);


      console.log(
        "URL DE REGISTRO:",
        url
      );


      /*
       * Creamos un <script>.
       *
       * Esto permite que GitHub Pages
       * reciba la respuesta de Apps Script
       * sin problemas de CORS.
       */

      const script =
        document.createElement("script");


      script.id =
        callbackName;


      script.src =
        url;


      /*
       * Si el script no puede cargarse,
       * mostramos error.
       */

      script.onerror =
        function() {

          console.error(
            "ERROR AL COMUNICARSE CON APPS SCRIPT"
          );


          mostrarEstado(
            "ERROR DE CONEXIÓN CON EL SERVIDOR",
            "error"
          );


          detalle.textContent =
            "No se pudo completar la comunicación con Apps Script.";


          delete window[callbackName];


          script.remove();


          procesando = false;

        };


      document.body.appendChild(
        script
      );

    }


    function mostrarEstado(
      texto,
      clase
    ) {

      estado.textContent =
        texto;


      estado.className =
        clase;

    }

  </script>

</body>
</html>
