<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prueba de cámara QAG</title>


  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }


    button {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      margin-bottom: 20px;
    }


    video {
      width: 100%;
      max-width: 600px;
      display: block;
      margin: auto;
      background: black;
    }


    #estado {
      margin-top: 20px;
      padding: 20px;
      background: white;
      font-size: 18px;
      text-align: center;
      white-space: pre-wrap;
    }

  </style>

</head>


<body>


  <h2>QAG — Prueba de cámara</h2>


  <button onclick="abrirCamara()">

    ABRIR CÁMARA

  </button>


  <video
    id="video"
    autoplay
    playsinline
  ></video>


  <div id="estado">

    Presioná ABRIR CÁMARA.

  </div>



  <script>


    async function abrirCamara() {


      const estado =
        document.getElementById(
          'estado'
        );


      estado.innerText =
        'Solicitando acceso a la cámara...';


      try {


        const stream =

          await navigator
            .mediaDevices
            .getUserMedia(


              {


                video: {


                  facingMode:
                    'environment'


                },


                audio: false


              }


            );



        const video =
          document.getElementById(
            'video'
          );


        video.srcObject =
          stream;



        estado.innerText =

          'CÁMARA ABIERTA CORRECTAMENTE ✓';


      }


      catch (error) {


        console.error(
          error
        );


        estado.innerText =

          'ERROR AL ABRIR LA CÁMARA:\n\n' +

          error.name +

          '\n\n' +

          error.message;


      }


    }


  </script>


</body>

</html>
