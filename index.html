<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QAG — Asistencia</title>


  <!-- Librería para lectura de códigos QR -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f4f7;
    }


    .contenedor {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }


    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }


    h1 {
      margin-top: 0;
      font-size: 26px;
    }


    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }


    select,
    button {
      width: 100%;
      padding: 15px;
      font-size: 17px;
      border-radius: 10px;
    }


    select {
      border: 1px solid #ccc;
    }


    button {
      margin-top: 12px;
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
    }


    #lector {
      width: 100%;
      min-height: 300px;
    }


    #resultado {
      min-height: 120px;
      text-align: center;
    }


    .gris {
      background: #eee;
    }


    .verde {
      background: #d9f5dc;
    }


    .rojo {
      background: #ffdada;
    }


    .amarillo {
      background: #fff0bc;
    }


    .estado {
      font-weight: bold;
      font-size: 19px;
    }


    .nombre {
      font-size: 23px;
      margin-top: 12px;
      font-weight: bold;
    }


    .oculto {
      display: none;
    }


    .lista {
      max-height: 250px;
      overflow-y: auto;
    }


    .estudiante {
      padding: 8px;
      border-bottom: 1px solid #eee;
    }

  </style>

</head>


<body>


  <div class="contenedor">


    <!-- ENCABEZADO Y SELECCIÓN DE DOCENTE -->

    <div class="tarjeta">


      <h1>QAG — Control de asistencia</h1>


      <label for="docente">
        Docente
      </label>


      <select id="docente">

        <option value="">
          Seleccionar docente
        </option>

        <option value="Cecilia">
          Cecilia
        </option>

        <option value="Silvia">
          Silvia
        </option>

        <option value="Carolina">
          Carolina
        </option>

        <option value="Florencia">
          Florencia
        </option>

      </select>


      <button
        type="button"
        onclick="iniciarScanner()"
      >
        📷 INICIAR ESCÁNER
      </button>


    </div>


    <!-- ZONA DE LA CÁMARA -->

    <div id="lector"></div>


    <!-- RESULTADO DEL ESCANEO -->

    <div
      id="resultado"
      class="tarjeta gris"
    >

      <div class="estado">
        Esperando...
      </div>


      <div class="nombre">
        Seleccioná el docente y activá el escáner.
      </div>


    </div>


    <!-- RESUMEN -->

    <div class="tarjeta">


      <button
        type="button"
        onclick="mostrarResumen()"
      >
        VER RESUMEN
      </button>


      <div
        id="resumen"
        class="oculto"
      >


        <h3 id="contador"></h3>


        <h3>Presentes</h3>


        <div
          id="presentes"
          class="lista"
        ></div>


        <h3>Ausentes</h3>


        <div
          id="ausentes"
          class="lista"
        ></div>


      </div>


    </div>


  </div>



  <script>


    /*************************************************
     * URL DE APPS SCRIPT
     *************************************************/

    const API_URL =
      'https://script.google.com/macros/s/AKfycbz91ha3LXqxi1y00Ol5ZMlKpovyIRuH0LaOdqrz8_-I5T09dazl29sXfhlzjqCjFEmm/exec';



    /*************************************************
     * VARIABLES GLOBALES
     *************************************************/

    let scanner = null;

    let escaneando = false;



    /*************************************************
     * INICIAR ESCÁNER
     *************************************************/

    function iniciarScanner() {


      const docente =
        document
          .getElementById('docente')
          .value;


      if (!docente) {

        alert(
          'Seleccioná un docente.'
        );

        return;

      }


      // Si existe un escáner anterior,
      // lo detenemos antes de iniciar nuevamente.

      if (scanner && escaneando) {


        scanner
          .stop()


          .catch(
            function() {

              // Ignoramos errores al detener.

            }
          )


          .finally(
            function() {

              scanner = null;

              escaneando = false;

              iniciarCamara();

            }
          );


        return;

      }


      iniciarCamara();


    }



    /*************************************************
     * INICIAR CÁMARA
     *************************************************/

    function iniciarCamara() {


      // Verificamos que la librería haya cargado.

      if (
        typeof Html5Qrcode ===
        'undefined'
      ) {


        mostrarResultado(
          'ERROR',
          'No se pudo cargar la librería del escáner QR.',
          'rojo'
        );


        return;

      }



      // Limpiamos la zona del lector.

      document
        .getElementById('lector')
        .innerHTML = '';



      // Creamos una nueva instancia del lector.

      scanner =
        new Html5Qrcode(
          'lector'
        );



      mostrarResultado(
        'INICIANDO CÁMARA...',
        'Esperá un momento.',
        'gris'
      );



      // Intentamos utilizar preferentemente
      // la cámara trasera.

      scanner
        .start(


          {
            facingMode: {
              ideal: 'environment'
            }
          },


          {


            // 10 cuadros por segundo suele ser
            // suficiente y compatible.

            fps: 10,


            // Zona amplia de detección.

            qrbox: {
              width: 280,
              height: 280
            }


          },


          // QR DETECTADO

          function(
            decodedText,
            decodedResult
          ) {


            onScanSuccess(
              decodedText,
              decodedResult
            );


          },


          // Mientras no detecta un QR,
          // no mostramos errores porque este
          // callback se ejecuta continuamente.

          function() {}


        )


        .then(


          function() {


            escaneando = true;


            mostrarResultado(
              'ESCÁNER ACTIVO',
              'Presentá el código QR dentro del recuadro.',
              'gris'
            );


          }


        )


        .catch(


          function(error) {


            console.error(
              'ERROR CÁMARA:',
              error
            );


            scanner = null;

            escaneando = false;


            mostrarResultado(
              'NO SE PUDO INICIAR LA CÁMARA',
              String(error),
              'rojo'
            );


          }


        );


    }



    /*************************************************
     * QR DETECTADO
     *************************************************/

    function onScanSuccess(
      decodedText,
      decodedResult
    ) {


      console.log(
        'QR DETECTADO:',
        decodedText
      );



      // Evitamos múltiples detecciones
      // del mismo QR.

      if (!escaneando) {

        return;

      }


      escaneando = false;



      // Detenemos inmediatamente la cámara
      // después de detectar el QR.

      scanner
        .stop()


        .then(


          function() {


            mostrarResultado(
              'QR DETECTADO ✓',
              decodedText,
              'verde'
            );


          }


        )


        .catch(


          function(error) {


            console.error(
              'Error al detener cámara:',
              error
            );


            mostrarResultado(
              'QR DETECTADO ✓',
              decodedText,
              'verde'
            );


          }


        );


    }



    /*************************************************
     * MOSTRAR RESULTADO
     *************************************************/

    function mostrarResultado(
      titulo,
      detalle,
      clase
    ) {


      const resultado =
        document.getElementById(
          'resultado'
        );


      resultado.className =
        'tarjeta ' + clase;


      resultado.innerHTML =

        '<div class="estado">' +

        titulo +

        '</div>' +


        '<div class="nombre">' +

        detalle +

        '</div>';


    }



    /*************************************************
     * MOSTRAR RESUMEN
     *************************************************/

    function mostrarResumen() {


      fetch(


        API_URL,


        {


          method: 'POST',


          body:

            JSON.stringify({


              accion:
                'RESUMEN'


            }),


          redirect:
            'follow'


        }


      )


      .then(


        function(respuesta) {


          if (
            !respuesta.ok
          ) {


            throw new Error(
              'HTTP ' +
              respuesta.status
            );


          }


          return respuesta.json();


        }


      )


      .then(


        function(data) {


          if (
            !data.ok
          ) {


            alert(
              data.mensaje
            );


            return;


          }



          document
            .getElementById(
              'resumen'
            )


            .classList


            .remove(
              'oculto'
            );



          document
            .getElementById(
              'contador'
            )


            .innerText =


              'Presentes: ' +


              data.presentes.length +


              ' / ' +


              data.total;



          const presentes =

            document.getElementById(
              'presentes'
            );



          const ausentes =

            document.getElementById(
              'ausentes'
            );



          presentes.innerHTML = '';

          ausentes.innerHTML = '';



          data.presentes.forEach(


            function(estudiante) {


              presentes.innerHTML +=


                '<div class="estudiante">' +


                estudiante.id +


                ' — ' +


                estudiante.nombre +


                '</div>';


            }


          );



          data.ausentes.forEach(


            function(estudiante) {


              ausentes.innerHTML +=


                '<div class="estudiante">' +


                estudiante.id +


                ' — ' +


                estudiante.nombre +


                '</div>';


            }


          );


        }


      )


      .catch(


        function(error) {


          console.error(
            error
          );


          alert(
            'Error al obtener el resumen.'
          );


        }


      );


    }


  </script>


</body>

</html>
