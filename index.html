<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QAG — Control de asistencia</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
      text-align: center;
    }

    .contenedor {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #666;
      margin-top: 0;
      margin-bottom: 25px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    #camara {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      background: black;
      margin-top: 10px;
    }

    #canvas {
      display: none;
    }

    #estado {
      margin-top: 20px;
      padding: 18px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .esperando {
      background: #e9e9e9;
      color: #555;
    }

    .procesando {
      background: #fff3cd;
      color: #856404;
    }

    .ok {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    #detalle {
      margin-top: 12px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>QAG</h1>
    <p class="subtitulo">Control de asistencia</p>

    <select id="docente">
      <option value="">Seleccionar docente</option>
      <option value="Cecilia">Cecilia</option>
      <option value="Silvia">Silvia</option>
      <option value="Carolina">Carolina</option>
      <option value="Florencia">Florencia</option>
    </select>

    <button id="botonCamara">
      📷 INICIAR ESCÁNER
    </button>

    <video id="camara" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="estado" class="esperando">
      Seleccioná un docente e iniciá el escáner
    </div>

    <div id="detalle"></div>

  </div>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbz91ha3LXqxi1y00Ol5ZMlKpovyIRuH0LaOdqrz8_-I5T09dazl29sXfhlzjqCjFEmm/exec";

    const video = document.getElementById("camara");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const docenteSelect =
      document.getElementById("docente");

    const botonCamara =
      document.getElementById("botonCamara");

    const estado =
      document.getElementById("estado");

    const detalle =
      document.getElementById("detalle");

    let stream = null;
    let escaneando = false;
    let procesando = false;


    botonCamara.addEventListener(
      "click",
      iniciarEscaner
    );


    async function iniciarEscaner() {

      if (procesando) return;

      const docente =
        docenteSelect.value;

      if (!docente) {

        mostrarEstado(
          "Seleccioná primero el docente",
          "error"
        );

        return;
      }

      detalle.textContent = "";

      try {

        stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment"
            },
            audio: false
          });

        video.srcObject = stream;

        escaneando = true;

        botonCamara.textContent =
          "📷 ESCANEANDO...";

        mostrarEstado(
          "Esperando código QR...",
          "esperando"
        );

        requestAnimationFrame(escanear);

      } catch (error) {

        console.error(error);

        mostrarEstado(
          "NO SE PUDO ACCEDER A LA CÁMARA",
          "error"
        );
      }
    }


    function escanear() {

      if (!escaneando) return;

      if (
        video.readyState ===
        video.HAVE_ENOUGH_DATA
      ) {

        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const imageData =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );

        const codigo =
          jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
              inversionAttempts:
                "attemptBoth"
            }
          );

        if (codigo) {

          console.log(
            "QR DETECTADO:",
            codigo.data
          );

          escaneando = false;

          detenerCamara();

          registrarAsistencia(
            codigo.data
          );

          return;
        }
      }

      setTimeout(() => {
        requestAnimationFrame(escanear);
      }, 100);
    }


    function detenerCamara() {

      escaneando = false;

      if (stream) {

        stream
          .getTracks()
          .forEach(track => {
            track.stop();
          });

        stream = null;
      }

      video.srcObject = null;

      botonCamara.textContent =
        "📷 INICIAR ESCÁNER";
    }


    async function registrarAsistencia(id) {

      if (procesando) return;

      procesando = true;

      const docente =
        docenteSelect.value;

      mostrarEstado(
        "PROCESANDO ASISTENCIA...",
        "procesando"
      );

      detalle.textContent =
        "QR detectado: " + id;


      const datosEnviar = {
        accion: "REGISTRAR",
        id: id,
        docente: docente
      };


      try {

        /*
         * IMPORTANTE:
         *
         * No usamos Content-Type.
         * Google Apps Script recibe
         * el JSON directamente desde
         * e.postData.contents.
         */

        const respuesta =
          await fetch(
            API_URL,
            {
              method: "POST",

              body: JSON.stringify(
                datosEnviar
              ),

              redirect: "follow"
            }
          );


        const texto =
          await respuesta.text();

        console.log(
          "RESPUESTA CRUDA:",
          texto
        );


        if (!respuesta.ok) {

          throw new Error(
            "HTTP " +
            respuesta.status
          );
        }


        let datos;

        try {

          datos =
            JSON.parse(texto);

        } catch (error) {

          console.error(
            "RESPUESTA NO JSON:",
            texto
          );

          throw new Error(
            "El servidor no devolvió JSON."
          );
        }


        console.log(
          "RESPUESTA DEL SERVIDOR:",
          datos
        );


        if (datos.ok) {

          if (
            datos.estado ===
            "REGISTRADO"
          ) {

            mostrarEstado(
              "✓ ASISTENCIA REGISTRADA",
              "ok"
            );

            detalle.innerHTML =
              "<strong>" +
              (datos.detalle || "") +
              "</strong><br>" +
              (datos.clase || "");

          }

          else if (
            datos.estado ===
            "DUPLICADO"
          ) {

            mostrarEstado(
              "⚠ YA REGISTRADO",
              "procesando"
            );

            detalle.textContent =
              datos.detalle || "";

          }

          else {

            mostrarEstado(
              datos.mensaje ||
              "OPERACIÓN COMPLETADA",
              "ok"
            );
          }

        } else {

          mostrarEstado(
            datos.mensaje ||
            "ERROR",
            "error"
          );

          detalle.textContent =
            datos.detalle || "";
        }


      } catch (error) {

        console.error(
          "ERROR AL REGISTRAR:",
          error
        );

        mostrarEstado(
          "ERROR DE CONEXIÓN CON EL SERVIDOR",
          "error"
        );

        detalle.textContent =
          "No se pudo completar la comunicación con Apps Script.";

      } finally {

        procesando = false;
      }
    }


    function mostrarEstado(
      texto,
      clase
    ) {

      estado.textContent =
        texto;

      estado.className =
        clase;
    }

  </script>

</body>
</html>
