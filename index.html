<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>QAG — Asistencia</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f2f4f7;
}

.contenedor {
  max-width: 650px;
  margin: auto;
  padding: 15px;
}

.tarjeta {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 10px rgba(0,0,0,.10);
}

h1 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

select,
button {
  width: 100%;
  padding: 15px;
  font-size: 17px;
  border-radius: 10px;
}

select {
  border: 1px solid #ccc;
}

button {
  margin-top: 12px;
  border: none;
  background: #222;
  color: white;
}

#lector {
  width: 100%;
}

#resultado {
  min-height: 120px;
  text-align: center;
}

.gris {
  background: #eee;
}

.verde {
  background: #d9f5dc;
}

.rojo {
  background: #ffdada;
}

.amarillo {
  background: #fff0bc;
}

.estado {
  font-weight: bold;
  font-size: 19px;
}

.nombre {
  font-size: 23px;
  margin-top: 12px;
  font-weight: bold;
}

.oculto {
  display: none;
}

.lista {
  max-height: 250px;
  overflow-y: auto;
}

.estudiante {
  padding: 8px;
  border-bottom: 1px solid #eee;
}

</style>

</head>

<body>

<div class="contenedor">

<div class="tarjeta">

<h1>QAG — Control de asistencia</h1>

<label for="docente">
Docente
</label>

<select id="docente">

<option value="">
Seleccionar docente
</option>

<option value="Cecilia">
Cecilia
</option>

<option value="Silvia">
Silvia
</option>

<option value="Carolina">
Carolina
</option>

<option value="Florencia">
Florencia
</option>

</select>

<button onclick="iniciarScanner()">
📷 INICIAR ESCÁNER
</button>

</div>


<div id="lector"></div>


<div
id="resultado"
class="tarjeta gris">

<div class="estado">
Esperando...
</div>

<div class="nombre">
Seleccioná el docente y activá el escáner.
</div>

</div>


<div class="tarjeta">

<button onclick="mostrarResumen()">
VER RESUMEN
</button>

<div
id="resumen"
class="oculto">

<h3 id="contador"></h3>

<h3>Presentes</h3>

<div
id="presentes"
class="lista">
</div>

<h3>Ausentes</h3>

<div
id="ausentes"
class="lista">
</div>

</div>

</div>

</div>


<script>


/*************************************************
 * PEGAR AQUÍ LA URL DE APPS SCRIPT TERMINADA EN /exec
 *************************************************/

const API_URL =
'https://script.google.com/macros/s/AKfycbz91ha3LXqxi1y00Ol5ZMlKpovyIRuH0LaOdqrz8_-I5T09dazl29sXfhlzjqCjFEmm/exec';


let scanner = null;

let escaneando = false;


/*************************************************
 * INICIAR CÁMARA
 *************************************************/

function iniciarScanner() {

  const docente =
    document
      .getElementById('docente')
      .value;


  if (!docente) {

    alert(
      'Seleccioná el docente.'
    );

    return;

  }


  if (scanner) {

    scanner.stop()
      .catch(() => {});

  }


  scanner =
    new Html5Qrcode(
      'lector'
    );


  scanner
    .start(

      {
        facingMode: 'environment'
      },

      {
        fps: 10,

        qrbox:
        {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      () => {}

    )

    .then(() => {

      escaneando = true;

      mostrarResultado(
        'ESCÁNER ACTIVO',
        'Presentá el QR del estudiante.',
        'gris'
      );

    })

    .catch(error => {

      console.error(error);

      mostrarResultado(
        'NO SE PUDO INICIAR LA CÁMARA',
        String(error),
        'rojo'
      );

    });

}


/*************************************************
 * QR DETECTADO
 *************************************************/

function onScanSuccess(
  decodedText
) {

  if (!escaneando)
    return;


  escaneando = false;


  mostrarResultado(
    'PROCESANDO...',
    decodedText,
    'gris'
  );


  const docente =
    document
      .getElementById('docente')
      .value;


  fetch(

    API_URL,

    {

      method: 'POST',

      body:

        JSON.stringify({

          accion:
          'REGISTRAR',

          id:
          decodedText,

          docente:
          docente

        }),

      redirect:
      'follow'

    }

  )

  .then(
    respuesta =>
      respuesta.json()
  )

  .then(
    resultado => {

      if (resultado.ok) {

        mostrarResultado(
          resultado.mensaje,
          resultado.detalle,
          'verde'
        );

      }

      else if (
        resultado.estado ===
        'DUPLICADO'
      ) {

        mostrarResultado(
          resultado.mensaje,
          resultado.detalle,
          'amarillo'
        );

      }

      else {

        mostrarResultado(
          resultado.mensaje,
          resultado.detalle ||
          '',
          'rojo'
        );

      }


      setTimeout(
        () => {
          escaneando = true;
        },
        1200
      );

    }

  )

  .catch(
    error => {

      console.error(error);

      mostrarResultado(
        'ERROR DE CONEXIÓN',
        String(error),
        'rojo'
      );


      setTimeout(
        () => {
          escaneando = true;
        },
        1500
      );

    }

  );

}


/*************************************************
 * MOSTRAR RESULTADO
 *************************************************/

function mostrarResultado(
  titulo,
  detalle,
  clase
) {

  const resultado =
    document
      .getElementById(
        'resultado'
      );


  resultado.className =
    'tarjeta ' +
    clase;


  resultado.innerHTML =

    '<div class="estado">' +

    titulo +

    '</div>' +

    '<div class="nombre">' +

    detalle +

    '</div>';

}


/*************************************************
 * RESUMEN
 *************************************************/

function mostrarResumen() {

  fetch(

    API_URL,

    {

      method:
      'POST',

      body:

        JSON.stringify({

          accion:
          'RESUMEN'

        }),

      redirect:
      'follow'

    }

  )

  .then(
    respuesta =>
      respuesta.json()
  )

  .then(
    data => {

      if (!data.ok) {

        alert(
          data.mensaje
        );

        return;

      }


      document
        .getElementById(
          'resumen'
        )
        .classList
        .remove(
          'oculto'
        );


      document
        .getElementById(
          'contador'
        )
        .innerText =

        'Presentes: ' +

        data.presentes.length +

        ' / ' +

        data.total;


      const presentes =
        document
          .getElementById(
            'presentes'
          );


      const ausentes =
        document
          .getElementById(
            'ausentes'
          );


      presentes.innerHTML =
        '';


      ausentes.innerHTML =
        '';


      data.presentes
        .forEach(
          estudiante => {

            presentes.innerHTML +=

              '<div class="estudiante">' +

              estudiante.id +

              ' — ' +

              estudiante.nombre +

              '</div>';

          }
        );


      data.ausentes
        .forEach(
          estudiante => {

            ausentes.innerHTML +=

              '<div class="estudiante">' +

              estudiante.id +

              ' — ' +

              estudiante.nombre +

              '</div>';

          }
        );

    }

  )

  .catch(
    error => {

      console.error(error);

      alert(
        'Error al obtener el resumen.'
      );

    }

  );

}


</script>

</body>

</html>
